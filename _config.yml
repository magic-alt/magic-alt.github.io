title: "Magic Alt 的博客"
name: "Magic Alt"
description: "使用 Minimal Mistakes 搭建的个人博客。"
url: "https://magic-alt.github.io"
baseurl: ""
repository: "magic-alt/magic-alt.github.io"
lang: zh-CN
timezone: Asia/Shanghai

minimal_mistakes_skin: "air"
search: true

remote_theme: "mmistakes/minimal-mistakes@4.27.3"

plugins:
  - jekyll-feed
  - jekyll-include-cache

permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/
show_excerpts: true

include:
  - _pages

author:
  name: "Magic Alt"
  avatar: "/assets/images/avatar.svg"
  bio: "在这里写一句话简介。"
  location: "China"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/magic-alt"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/magic-alt"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
