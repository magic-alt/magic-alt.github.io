<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Avatar">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="256" height="256" rx="128" fill="url(#bg)" />
  <!-- Neural network nodes -->
  <circle cx="80" cy="80" r="8" fill="rgba(255,255,255,0.9)" />
  <circle cx="176" cy="80" r="8" fill="rgba(255,255,255,0.9)" />
  <circle cx="128" cy="128" r="10" fill="rgba(255,255,255,1)" />
  <circle cx="80" cy="176" r="8" fill="rgba(255,255,255,0.9)" />
  <circle cx="176" cy="176" r="8" fill="rgba(255,255,255,0.9)" />
  <!-- Connections -->
  <line x1="80" y1="80" x2="128" y2="128" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
  <line x1="176" y1="80" x2="128" y2="128" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
  <line x1="128" y1="128" x2="80" y2="176" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
  <line x1="128" y1="128" x2="176" y2="176" stroke="rgba(255,255,255,0.5)" stroke-width="2" />
  <line x1="80" y1="80" x2="176" y2="80" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
  <line x1="80" y1="176" x2="176" y2="176" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
  <line x1="80" y1="80" x2="80" y2="176" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
  <line x1="176" y1="80" x2="176" y2="176" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
  <!-- Extra nodes for depth -->
  <circle cx="128" cy="60" r="5" fill="rgba(255,255,255,0.6)" />
  <circle cx="128" cy="196" r="5" fill="rgba(255,255,255,0.6)" />
  <circle cx="60" cy="128" r="5" fill="rgba(255,255,255,0.6)" />
  <circle cx="196" cy="128" r="5" fill="rgba(255,255,255,0.6)" />
  <!-- Extra connections -->
  <line x1="128" y1="60" x2="128" y2="128" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
  <line x1="128" y1="196" x2="128" y2="128" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
  <line x1="60" y1="128" x2="128" y2="128" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
  <line x1="196" y1="128" x2="128" y2="128" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
  <!-- Center highlight -->
  <circle cx="128" cy="128" r="16" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
  <!-- Text -->
  <text x="128" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="rgba(255,255,255,0.8)" text-anchor="middle">M</text>
</svg>
